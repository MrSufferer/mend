[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
build_info = true
extra_output = ["storageLayout"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
[profile.default.fuzz]
runs = 1000
[profile.default.invariant]
runs = 1000
depth = 64
fail_on_revert = true
